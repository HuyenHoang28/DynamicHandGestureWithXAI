# Temporal template V2 cho IPN Hand 13 lớp (bỏ D0X).
# Count/order chỉ được hiệu chỉnh trên train/validation; không sửa template theo test.
version: 2
description: IPN Hand temporal templates, label ids 0-12 from the locked manifest
template_policy:
  matching:
    required_weight: 1.0
    preferred_weight: 0.6
    optional_weight: 0.3
    negative_weight: -1.0
gestures:
  B0A:
    description: Pointing with one finger - index finger extended, hand moves slowly like a cursor
    expected_events:
      - subject: any
        hand_shapes:
          required:
            - index_extended
        motions:
          optional:
            - hand_stationary
    negative_evidence:
      hand_shapes:
        - index_middle_extended
        - hand_open
      motions:
        - hand_fast_motion
    notes:
      - Gan giong G01/G08; khac o cho khong co nhip ngon tro gap xuong.
  B0B:
    description: Pointing with two fingers - index and middle fingers extended, hand moves slowly
    expected_events:
      - subject: any
        hand_shapes:
          required:
            - index_middle_extended
        motions:
          optional:
            - hand_stationary
    negative_evidence:
      hand_shapes:
        - hand_open
      motions:
        - hand_fast_motion
    notes:
      - Gan giong G02/G09; khac o cho khong co nhip click.
  G01:
    description: Click with one finger - index finger extended, taps down once
    expected_events:
      - subject: any
        min_occurrences: 1
        max_occurrences: 1
        hand_shapes:
          required:
            - index_extended
        finger_motions:
          required:
            - index_finger_moves_down
          preferred:
            - index_finger_moves_up
    negative_evidence:
      hand_shapes:
        - index_middle_extended
      motions:
        - hand_fast_motion
    notes:
      - Mot event click xuong; max_occurrences tach khoi G08.
  G02:
    description: Click with two fingers - index and middle fingers extended, tap down once
    expected_events:
      - subject: any
        min_occurrences: 1
        max_occurrences: 1
        hand_shapes:
          required:
            - index_middle_extended
        finger_motions:
          required:
            - index_finger_moves_down
            - middle_finger_moves_down
          preferred:
            - index_finger_moves_up
    negative_evidence:
      motions:
        - hand_fast_motion
    notes:
      - Hai ngon phai cung co chuyen dong xuong trong active phase.
  G03:
    description: Throw up - hand moves quickly upward
    expected_events:
      - subject: any
        motions:
          required:
            - hand_moves_up
          preferred:
            - hand_fast_motion
        hand_shapes:
          optional:
            - hand_open
    negative_evidence:
      motions:
        - hand_moves_left
        - hand_moves_right
    notes:
      - Clip co the co pha tay quay ve nen khong dat hand_moves_down la negative.
  G04:
    description: Throw down - hand moves quickly downward
    expected_events:
      - subject: any
        motions:
          required:
            - hand_moves_down
          preferred:
            - hand_fast_motion
        hand_shapes:
          optional:
            - hand_open
    negative_evidence:
      motions:
        - hand_moves_left
        - hand_moves_right
  G05:
    description: Throw left from the performer's perspective - motion goes right in image coordinates
    expected_events:
      - subject: any
        motions:
          required:
            - hand_moves_right
          preferred:
            - hand_fast_motion
        hand_shapes:
          optional:
            - hand_open
    negative_evidence:
      motions:
        - hand_moves_up
        - hand_moves_down
    notes:
      - Da doi chieu theo toa do anh sau khi xem clip train va validation: trai cua nguoi thuc hien la phai tren anh.
  G06:
    description: Throw right from the performer's perspective - motion goes left in image coordinates
    expected_events:
      - subject: any
        motions:
          required:
            - hand_moves_left
          preferred:
            - hand_fast_motion
        hand_shapes:
          optional:
            - hand_open
    negative_evidence:
      motions:
        - hand_moves_up
        - hand_moves_down
    notes:
      - Da doi chieu theo toa do anh sau khi xem clip train va validation: phai cua nguoi thuc hien la trai tren anh.
  G07:
    description: Open twice - hand goes from closed to open, repeated two times
    expected_events:
      - subject: any
        hand_shapes:
          required:
            - hand_closed
      - subject: any
        hand_shapes:
          required:
            - hand_open
        finger_motions:
          preferred:
            - fingers_spread_increasing
      - subject: any
        hand_shapes:
          required:
            - hand_closed
        finger_motions:
          preferred:
            - fingers_spread_decreasing
      - subject: any
        hand_shapes:
          required:
            - hand_open
        finger_motions:
          preferred:
            - fingers_spread_increasing
    negative_evidence:
      motions:
        - hand_fast_motion
    notes:
      - Bon phase ordered closed-open-closed-open bieu dien hai chu ky.
  G08:
    description: Double click with one finger - index finger taps down twice
    expected_events:
      - subject: any
        min_occurrences: 2
        hand_shapes:
          required:
            - index_extended
        finger_motions:
          required:
            - index_finger_moves_down
          preferred:
            - index_finger_oscillates
            - index_finger_moves_up
    negative_evidence:
      hand_shapes:
        - index_middle_extended
      motions:
        - hand_fast_motion
    notes:
      - Can it nhat hai event click xuong tach khoi G01.
  G09:
    description: Double click with two fingers - index and middle fingers tap down twice
    expected_events:
      - subject: any
        min_occurrences: 2
        hand_shapes:
          required:
            - index_middle_extended
        finger_motions:
          required:
            - index_finger_moves_down
            - middle_finger_moves_down
          preferred:
            - index_finger_oscillates
            - index_finger_moves_up
    negative_evidence:
      motions:
        - hand_fast_motion
    notes:
      - Can it nhat hai event click hai ngon tach khoi G02.
  G10:
    description: Zoom in - fingers spread apart from a pinched pose
    expected_events:
      - subject: any
        finger_motions:
          required:
            - pinch_distance_increasing
          preferred:
            - fingers_spread_increasing
        hand_shapes:
          optional:
            - hand_open
    negative_evidence:
      finger_motions:
        - pinch_distance_decreasing
    notes:
      - Da xac nhan tren clip train va validation: zoom in mo khoang cach ngon cai-ngon tro.
  G11:
    description: Zoom out - fingers move together into a pinched pose
    expected_events:
      - subject: any
        finger_motions:
          required:
            - pinch_distance_decreasing
          preferred:
            - fingers_spread_decreasing
        hand_shapes:
          optional:
            - fingers_slightly_curled
    negative_evidence:
      finger_motions:
        - pinch_distance_increasing
    notes:
      - Da xac nhan tren clip train va validation: zoom out thu khoang cach ngon cai-ngon tro.
