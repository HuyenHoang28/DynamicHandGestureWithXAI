# Temporal template V2 cho IPN Hand 13 lớp (bỏ D0X).
# Revision sau khi chốt neural C: ưu tiên G02/G09, G01/G08 và G10/G11,
# dùng conjunction trong cùng episode và bỏ negative evidence toàn clip vì các
# predicate chuyển động trả tay xuất hiện ở hầu hết lớp.
# Count/order chỉ được hiệu chỉnh trên train/validation; không sửa template theo test.
version: 2
description: Conservative post-experiment-C templates for neural arbitration, label ids 0-12
template_policy:
  matching:
    required_weight: 1.0
    preferred_weight: 0.5
    optional_weight: 0.25
    negative_weight: -0.5
    role_alignment_floor: 0.85
gestures:
  B0A:
    description: Pointing with one finger - index finger extended, hand moves slowly like a cursor
    expected_events:
      - subject: any
        hand_shapes:
          required:
            - index_extended
        motions:
          preferred:
            - hand_stationary
    negative_evidence: {}
    notes:
      - Evidence bao thu cho arbitration; stationary chi cong diem khi nam cung episode voi shape.
      - Khong ma hoa "khong click" bang negative toan clip vi pha tra tay tao false penalty.
  B0B:
    description: Pointing with two fingers - index and middle fingers extended, hand moves slowly
    expected_events:
      - subject: any
        hand_shapes:
          required:
            - index_middle_extended
        motions:
          preferred:
            - hand_stationary
    negative_evidence: {}
    notes:
      - Evidence bao thu cho arbitration; stationary chi cong diem khi cung episode voi two-finger shape.
      - Khong ma hoa "khong click" bang negative toan clip.
  G01:
    description: Click with one finger - index finger extended, taps down once
    expected_events:
      - subject: any
        min_occurrences: 1
        max_occurrences: 1
        hand_shapes:
          required:
            - index_extended
        finger_motions:
          required:
            - index_finger_moves_down
          preferred:
            - index_finger_moves_up
    negative_evidence: {}
    notes:
      - Mot episode co index shape va down motion dong thoi; max_occurrences tach khoi G08.
      - Pha up chi la preferred vi co the bi cat boi phase segmentation.
  G02:
    description: Click with two fingers - index and middle fingers extended, tap down once
    expected_events:
      - subject: any
        min_occurrences: 1
        max_occurrences: 1
        hand_shapes:
          required:
            - index_middle_extended
        finger_motions:
          required:
            - index_finger_moves_down
            - middle_finger_moves_down
          preferred:
            - index_finger_moves_up
    negative_evidence: {}
    notes:
      - Shape, index-down va middle-down phai cung nam trong mot episode.
      - Max mot episode day du de tach khoi G09.
  G03:
    description: Throw up - hand moves quickly upward
    expected_events:
      - subject: any
        motions:
          required:
            - hand_moves_up
          preferred:
            - hand_fast_motion
        hand_shapes:
          optional:
            - hand_open
    negative_evidence: {}
    notes:
      - Fast motion chi cong diem khi dong thoi voi direction; khong phat pha tra tay tren toan clip.
  G04:
    description: Throw down - hand moves quickly downward
    expected_events:
      - subject: any
        motions:
          required:
            - hand_moves_down
          preferred:
            - hand_fast_motion
        hand_shapes:
          optional:
            - hand_open
    negative_evidence: {}
    notes:
      - Fast motion chi cong diem khi dong thoi voi direction; khong phat pha tra tay tren toan clip.
  G05:
    description: Throw left from the performer's perspective - motion goes right in image coordinates
    expected_events:
      - subject: any
        motions:
          required:
            - hand_moves_right
          preferred:
            - hand_fast_motion
        hand_shapes:
          optional:
            - hand_open
    negative_evidence: {}
    notes:
      - Da doi chieu theo toa do anh sau khi xem clip train va validation: trai cua nguoi thuc hien la phai tren anh.
      - Fast motion chi cong diem khi dong thoi voi direction trong episode duoc matcher chon; action role chi dung de audit.
  G06:
    description: Throw right from the performer's perspective - motion goes left in image coordinates
    expected_events:
      - subject: any
        motions:
          required:
            - hand_moves_left
          preferred:
            - hand_fast_motion
        hand_shapes:
          optional:
            - hand_open
    negative_evidence: {}
    notes:
      - Da doi chieu theo toa do anh sau khi xem clip train va validation: phai cua nguoi thuc hien la trai tren anh.
      - Fast motion chi cong diem khi dong thoi voi direction trong episode duoc matcher chon; action role chi dung de audit.
  G07:
    description: Open twice - hand goes from closed to open, repeated two times
    expected_events:
      - subject: any
        action_role: any
        hand_shapes:
          required:
            - hand_closed
      - subject: any
        action_role: any
        hand_shapes:
          required:
            - hand_open
        finger_motions:
          preferred:
            - fingers_spread_increasing
      - subject: any
        hand_shapes:
          required:
            - hand_closed
        finger_motions:
          preferred:
            - fingers_spread_decreasing
      - subject: any
        hand_shapes:
          required:
            - hand_open
        finger_motions:
          preferred:
            - fingers_spread_increasing
    negative_evidence: {}
    notes:
      - Bon phase ordered closed-open-closed-open bieu dien hai chu ky.
      - Spread trend cung episode la evidence uu tien de giam subsequence ngau nhien, khong phai hard gate.
  G08:
    description: Double click with one finger - index finger taps down twice
    expected_events:
      - subject: any
        min_occurrences: 2
        max_occurrences: 2
        hand_shapes:
          required:
            - index_extended
        finger_motions:
          required:
            - index_finger_moves_down
          preferred:
            - index_finger_oscillates
            - index_finger_moves_up
    negative_evidence: {}
    notes:
      - Can dung hai episode click xuong tach biet; max hai de giam false double-click do fragmentation.
  G09:
    description: Double click with two fingers - index and middle fingers tap down twice
    expected_events:
      - subject: any
        min_occurrences: 2
        max_occurrences: 2
        hand_shapes:
          required:
            - index_middle_extended
        finger_motions:
          required:
            - index_finger_moves_down
            - middle_finger_moves_down
          preferred:
            - index_finger_oscillates
            - index_finger_moves_up
    negative_evidence: {}
    notes:
      - Can dung hai episode day du shape/index-down/middle-down va tach biet.
  G10:
    description: Zoom in - fingers spread apart from a pinched pose
    expected_events:
      - subject: any
        finger_motions:
          required:
            - pinch_distance_increasing
          preferred:
            - fingers_spread_increasing
        hand_shapes:
          optional:
            - hand_open
    negative_evidence: {}
    notes:
      - Da xac nhan tren clip train va validation: zoom in mo khoang cach ngon cai-ngon tro.
      - Spread cung chieu chi cong diem khi nam trong episode duoc matcher chon; active/return duoc log rieng cho arbitration.
  G11:
    description: Zoom out - fingers move together into a pinched pose
    expected_events:
      - subject: any
        finger_motions:
          required:
            - pinch_distance_decreasing
          preferred:
            - fingers_spread_decreasing
        hand_shapes:
          optional:
            - fingers_slightly_curled
    negative_evidence: {}
    notes:
      - Da xac nhan tren clip train va validation: zoom out thu khoang cach ngon cai-ngon tro.
      - Spread cung chieu chi cong diem khi nam trong episode duoc matcher chon; active/return duoc log rieng cho arbitration.
